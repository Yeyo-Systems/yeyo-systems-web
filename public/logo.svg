<svg width="680" height="160" viewBox="0 0 680 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes Cyber Neón -->
    <linearGradient id="logo-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <linearGradient id="logo-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="logo-mint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Gradiente para el texto SYSTEMS -->
    <linearGradient id="text-systems-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ==================== 1. ISOTIPO 3D (HYPER-CUBE) ==================== -->
  <g transform="translate(10, 10)">
    <!-- Caras Cubo Isométrico Y -->
    <path d="M 70 20 L 20 48 L 45 62 L 70 48 Z" fill="url(#logo-cyan)" opacity="0.95" filter="url(#logo-glow)" />
    <path d="M 70 20 L 120 48 L 95 62 L 70 48 Z" fill="url(#logo-violet)" opacity="0.9" filter="url(#logo-glow)" />
    <path d="M 70 48 L 95 62 L 70 76 L 45 62 Z" fill="#00F0FF" opacity="0.3" />
    
    <!-- Tallo y Base -->
    <path d="M 70 76 L 95 62 L 95 112 L 70 126 Z" fill="url(#logo-violet)" opacity="0.85" />
    <path d="M 70 76 L 45 62 L 45 112 L 70 126 Z" fill="url(#logo-cyan)" opacity="0.95" />
    <path d="M 70 126 L 95 112 L 70 100 L 45 112 Z" fill="url(#logo-mint)" />

    <!-- Líneas Neón -->
    <path d="M 70 20 L 70 76 M 70 76 L 70 126" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7" />
    <path d="M 20 48 L 70 76 L 120 48" stroke="#00F0FF" stroke-width="2" opacity="0.8" />
  </g>

  <!-- ==================== 2. TIPOGRAFÍA CORPORATIVA ==================== -->
  <!-- "YEYO" en tipografía geométrica gruesa -->
  <text x="160" y="90" fill="#FFFFFF" font-family="System-UI, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4">
    YEYO
  </text>

  <!-- "SYSTEMS" con Gradiente Neón -->
  <text x="365" y="90" fill="url(#text-systems-grad)" font-family="System-UI, -apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4" filter="url(#logo-glow)">
    SYSTEMS
  </text>

  <!-- Tagline / Subtítulo Institucional -->
  <text x="162" y="122" fill="#94A3B8" font-family="&#39;Courier New&#39;, Courier, monospace" font-weight="600" font-size="14" letter-spacing="7">
    MULTI-PLATFORM ECOSYSTEM
  </text>

  <!-- Punto de Estado Activo Real-Time -->
  <circle cx="560" cy="118" r="4" fill="#10B981" filter="url(#logo-glow)" />
</svg>