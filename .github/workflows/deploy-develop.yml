name: CI & Deploy Develop to Firebase App Hosting

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_and_deploy:
    name: Test, Build & Deploy (Develop — App Hosting)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY_DEVELOP }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_DEVELOP }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEVELOP }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_DEVELOP }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_DEVELOP }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID_DEVELOP }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID_DEVELOP }}
      FIREBASE_PROJECT_ID_DEVELOP: ${{ vars.FIREBASE_PROJECT_ID_DEVELOP }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js Application
        run: npm run build

      - name: Verify isolated deploy configuration
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          test -n "$FIREBASE_PROJECT_ID_DEVELOP" || (echo "Missing FIREBASE_PROJECT_ID_DEVELOP" && exit 1)
          test -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS_DEVELOP }}" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS_DEVELOP" && exit 1)

      - name: Deploy to Firebase App Hosting (Develop)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: FirebaseExtended/firebase-github-actions/deploy-hosting@main
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS_DEVELOP }}
          projectId: ${{ env.FIREBASE_PROJECT_ID_DEVELOP }}
          target: develop
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels
