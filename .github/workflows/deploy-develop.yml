name: CI & Deploy Develop to Firebase Hosting

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_and_preview:
    name: Test, Build & Preview (Develop)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY_DEVELOP || secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyDeYhoDLX7-fmWOUjAQdlrq-cFiOS1rP-Q' }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_DEVELOP || 'yeyo-systems-dev.firebaseapp.com' }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID_DEVELOP || 'yeyo-systems-dev' }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_DEVELOP || 'yeyo-systems-dev.firebasestorage.app' }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_DEVELOP || '867937526837' }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID_DEVELOP || '1:867937526837:web:a2ec1362ba9fe52fb83d7c' }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID_DEVELOP || 'G-TF25C8921B' }}
      NODE_ENV: development
      FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS }}
      FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS_DEVELOP: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS_DEVELOP }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

      - name: Deploy Preview on Pull Request
        if: github.event_name == 'pull_request' && env.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS }}
          projectId: yeyo-systems

      - name: Deploy to Develop Project (When Configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && env.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS_DEVELOP != ''
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS_DEVELOP }}
          projectId: ${{ env.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          channelId: live
