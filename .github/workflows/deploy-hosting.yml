name: Deploy Firebase Hosting

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding the Firebase variables and credentials
        type: string
        required: true
      expected_project:
        description: Firebase project the environment is allowed to target
        type: string
        required: true
      url:
        description: Public URL of the deployed site
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Build & Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
    steps:
      # Blocks an environment whose variables point to another Firebase project
      # and picks the credential type: Workload Identity Federation (keyless) when
      # configured, otherwise a service account JSON key.
      - name: Verify environment isolation
        id: auth
        env:
          EXPECTED_PROJECT: ${{ inputs.expected_project }}
          HAS_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          fail=0
          if [[ "$FIREBASE_PROJECT_ID" != "$EXPECTED_PROJECT" ]]; then
            echo "::error::vars.FIREBASE_PROJECT_ID must be '$EXPECTED_PROJECT' (got '${FIREBASE_PROJECT_ID:-<empty>}')."
            fail=1
          fi
          if [[ "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" != "$EXPECTED_PROJECT" ]]; then
            echo "::error::vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID must be '$EXPECTED_PROJECT'."
            fail=1
          fi
          if [[ -n "$WIF_PROVIDER" && -n "$WIF_SERVICE_ACCOUNT" ]]; then
            if [[ "$WIF_SERVICE_ACCOUNT" != *"@$EXPECTED_PROJECT.iam.gserviceaccount.com" ]]; then
              echo "::error::vars.GCP_SERVICE_ACCOUNT must belong to '$EXPECTED_PROJECT'."
              fail=1
            fi
            echo "mode=wif" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_SERVICE_ACCOUNT" == "true" ]]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Environment '${{ inputs.environment }}' needs GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT variables or the FIREBASE_SERVICE_ACCOUNT secret."
            fail=1
          fi
          exit $fail

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint & Typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Build static export
        run: |
          npm run build
          test -f out/index.html

      - name: Deploy to Firebase Hosting (live, service account key)
        if: steps.auth.outputs.mode == 'key'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ inputs.expected_project }}
          channelId: live

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.auth.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting (live, keyless)
        if: steps.auth.outputs.mode == 'wif'
        env:
          EXPECTED_PROJECT: ${{ inputs.expected_project }}
        run: npx -y firebase-tools@15 deploy --only hosting --project "$EXPECTED_PROJECT" --non-interactive
