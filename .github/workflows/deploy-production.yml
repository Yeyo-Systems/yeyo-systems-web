name: Deploy Production to Firebase Hosting

on:
  push:
    branches:
      - master

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy_production:
    name: Build & Deploy to Production (yeyo-systems)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY_PRODUCTION }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN_PRODUCTION }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID_PRODUCTION }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET_PRODUCTION }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_PRODUCTION }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID_PRODUCTION }}
      NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID_PRODUCTION }}
      NODE_ENV: production
      FIREBASE_PROJECT_ID_PRODUCTION: ${{ vars.FIREBASE_PROJECT_ID_PRODUCTION }}
      FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Static Analysis
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

      - name: Verify production deploy configuration
        run: |
          test -n "$FIREBASE_PROJECT_ID_PRODUCTION"
          test -n "$FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS"

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YEYO_SYSTEMS }}
          projectId: ${{ env.FIREBASE_PROJECT_ID_PRODUCTION }}
          channelId: live
