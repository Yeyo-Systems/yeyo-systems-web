# Shared Firebase App Hosting runtime configuration.
#
# This file intentionally contains no project identifier, Firebase Web SDK
# configuration, or secret value. A backend must be attached only to an
# isolated Firebase project, and its environment values must be configured in
# the backend settings or in an environment-specific apphosting.<env>.yaml.
# Never use NEXT_PUBLIC_ variables for secrets.

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

# Environment values are configured per backend, outside this shared file.
